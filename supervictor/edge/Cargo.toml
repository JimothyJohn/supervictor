[package]
edition = "2021"
name = "supervictor-edge"
version = "0.1.0"

[[bin]]
name = "supervictor-embedded"
path = "./src/bin/embedded_main.rs"
required-features = ["embedded"]

[[bin]]
name = "supervictor-desktop"
path = "./src/bin/desktop_main.rs"
required-features = ["desktop"]

[features]
# Telemetry simulator (models/sim.rs + profile.rs): invented current /
# temperature / humidity / RSSI traces for a board without sensors. OFF by
# default (decided 2026-10-27) so a production image can never report a
# reading it did not take. The bench scripts pass it explicitly (flash.sh,
# ota-push.sh: SIM=1 default, SIM=0 for a production image); the desktop
# client IS the simulator, so `desktop` implies it. Tests always compile it.
sim = []
desktop = ["tokio", "rustls", "tokio-rustls", "rustls-pemfile", "sim"]
# Chip selection — embedded builds need exactly one, matched to the cargo
# --target (chip-esp32 ↔ xtensa-esp32-none-elf, chip-esp32c3 ↔
# riscv32imc-unknown-none-elf). Fans the choice out to every esp-rs crate;
# the '?' forwards only when that optional dep is enabled, and esp-backtrace
# forwards the chip on to esp-println. `ethernet` implies chip-esp32 — only
# the classic ESP32 has an EMAC.
chip-esp32 = [
  "esp-hal?/esp32",
  "esp-backtrace?/esp32",
  "esp-rtos?/esp32",
  "esp-radio?/esp32",
  "esp-bootloader-esp-idf?/esp32",
  "esp-storage?/esp32",
]
chip-esp32c3 = [
  "esp-hal?/esp32c3",
  "esp-backtrace?/esp32c3",
  "esp-rtos?/esp32c3",
  "esp-radio?/esp32c3",
  "esp-bootloader-esp-idf?/esp32c3",
  "esp-storage?/esp32c3",
]
# Base embedded runtime (no network interface). The supervictor-embedded bin
# additionally needs exactly one interface feature: `ethernet` (primary — the
# POE-ISO uplinks over wired PoE; implies chip-esp32) or `wifi` (pair with a
# chip-* feature).
embedded = [
  "esp-alloc",
  "esp-backtrace",
  "esp-hal",
  "esp-rtos",
  "esp-println",
  "embassy-net",
  "embassy-executor",
  "embassy-time",
  "embedded-io-async",
  "mbedtls-rs",
  "esp-bootloader-esp-idf",
  "esp-storage",
  "embedded-storage",
  "static_cell",
]
wifi = ["embedded", "esp-radio", "esp-rtos/esp-radio"]
ethernet = ["embedded", "ph-esp32-mac", "embassy-net-driver", "esp32", "chip-esp32"]
# Board variant on top of `ethernet`. Default is the ESP32-POE-ISO (RMII clock
# out GPIO17); `board-poe2` is the ESP32-POE2, whose WROVER-E keeps 16/17 for
# PSRAM and takes the clock out of GPIO0 (see src/board/poe2.rs).
board-poe2 = ["ethernet"]
# Coexistence spike (TODO.md P2): ESP-NOW beacons on the WiFi radio next to
# the wired EMAC uplink. Stacks on `ethernet` (or `board-poe2`); the radio
# comes up in station mode without joining a network, so no SSID is needed.
espnow = ["wifi", "esp-radio/esp-now"]

# Use custom libraries
[lib]
name = "supervictor"
path = "./src/lib.rs"

# Examples target the ESP32 and need the embedded dep set; gating them keeps
# host-side `cargo clippy/test --all-targets` runnable from the workspace root.
[[example]]
name = "hello_world"
required-features = ["embedded"]

[[example]]
name = "wifi_embassy_dhcp"
required-features = ["wifi"]

[[example]]
name = "tls_dns_dhcp_wifi"
required-features = ["wifi"]

[dependencies]
# Shared wire contract: the 8-bit register table (`levels`) must be the
# same bytes on both ends, so it lives in one crate. no_std, zero deps
# without its `alloc` feature.
supervictor-common = { path = "../common", default-features = false }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "dns",
], optional = true }

tokio = { version = "1.0", optional = true, features = ["full"] }

embedded-io-async = { version = "0.7.0", optional = true }
esp-alloc = { version = "0.9.0", optional = true }
esp-backtrace = { version = "0.18.1", features = [
  "panic-handler",
  "println",
], optional = true }
# =1.0.0: esp-hal 1.1.x removed unstable APIs (InterruptHandler::new_not_nested)
# still used by esp-rtos 0.2 / esp-radio 0.17; unpin when bumping those to 0.3/0.18
esp-hal = { version = "=1.0.0", default-features = false, features = [
  "log-04",
  "unstable",
  "exception-handler",
], optional = true }
esp-println = { version = "0.16", features = [
  "log-04",
], optional = true }
embassy-executor = { version = "0.9.0", optional = true }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"], optional = true }
esp-rtos = { version = "0.2", features = ["embassy"], optional = true }
esp-radio = { version = "0.17", features = [
  "wifi",
  "log-04",
  "unstable",
], optional = true }
# serde feature: heapless 0.9 gates its Serialize/Deserialize impls behind
# it (0.8 got them transitively via serde-json-core's feature unification).
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
static_cell = { version = "2.1.0", optional = true, features = ["nightly"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc"] }
serde-json-core = "0.7.0"
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs.git", rev = "4329f17", optional = true, features = ["log"] }
# ESP32 EMAC (wired Ethernet) driver. crates.io 0.1.1 cannot detect any PHY —
# MDIO reads are broken; upstream merged the fix as photon-circus/ph-esp32-mac#4
# (2026-07-25) but has not cut a release. Pinned to that merge commit on the
# upstream repo (its tree is byte-identical to the hardware-verified fork rev
# 4cdad7f the rack ran on, so no re-soak was needed). Move to crates.io when a
# release > 0.1.1 appears; Dependabot cannot watch a git dependency.
ph-esp32-mac = { git = "https://github.com/photon-circus/ph-esp32-mac", rev = "b05d53ade4224361175283ac1b65c7504a029301", features = [
  "esp-hal",
  "embassy-net",
  "log",
], optional = true }
# Driver-trait layer for ph-esp32-mac's embassy integration (its statics macro
# names embassy_net_driver::LinkState in our namespace).
embassy-net-driver = { version = "0.2", optional = true }
# Raw PAC for the two ESP32 registers esp-hal doesn't expose (RTC ANA_CONF for
# APLL power-up, IO_MUX GPIO17 for the RMII clock-out mux). Same version
# esp-hal 1.0 already pulls — no new transitive weight.
esp32 = { version = "0.40", optional = true }
esp-bootloader-esp-idf = { version = "0.5", optional = true }
# OTA (src/ota): the SPI-flash driver behind the embedded-storage traits
# that esp-bootloader-esp-idf's FlashRegion/OtaUpdater need. 0.8.x is the
# line that pairs with esp-hal 1.0 (0.9 wants 1.1, 0.10 wants 1.2).
esp-storage = { version = "0.8.1", optional = true }
# The Storage/ReadStorage traits FlashRegion speaks (in the lock via both
# crates above).
embedded-storage = { version = "0.3.1", optional = true }
# OTA image digests, software: mbedtls-rs-sys owns the SHA peripheral on
# the chips where it is used, and the download must hash while TLS runs.
# Already in the lock through esp-hal and mbedtls-rs-sys; no new crate.
sha2 = { version = "0.11", default-features = false }
# ring is the provider desktop_main installs; default features would compile
# the aws-lc-rs provider (a large C build) alongside it for nothing. The ring
# flag used to arrive via reqwest's feature unification (reqwest is now
# dev-only — tests/deployed_roundtrip.rs).
rustls = { version = "0.23.26", optional = true, default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
# default features would re-enable rustls/aws_lc_rs; mirror the rustls set.
tokio-rustls = { version = "0.26.2", optional = true, default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
rustls-pemfile = { version = "2.2.0", optional = true }

[dev-dependencies]
# Fault-schedule property tests for the OTA installer (src/ota/install_tests.rs).
proptest = { version = "1.12", default-features = false, features = ["std"] }
tokio = { version = "1.0", features = ["full"] }
rustls = "0.23.26"
tokio-rustls = "0.26.2"
rcgen = "0.14"

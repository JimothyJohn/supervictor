[toolchain]
# Xtensa (original ESP32) needs the esp-rs fork toolchain, installed via
# `espup install` — the bare-metal xtensa-esp32-none-elf target is not in
# upstream rustc. The esp channel ships rust-src, rustfmt, and clippy;
# rustup ignores component/target requests for custom toolchains, so none
# are listed here.
channel = "esp"

AWSTemplateFormatVersion: "2010-09-09"
Description: Supervictor endpoint - staging (one EC2 box running the single-binary release)

# One t4g.micro that installs a GitHub release of supervictor-endpoint on
# first boot (scripts/install-endpoint.sh: static musl binary, hardened
# systemd unit, PEMs from S3, SQLite under /var/lib/supervictor). No Docker,
# no Caddy, no on-box build. Updates: scripts/staging-stack-update.sh (pins
# the live AMI so the instance is never replaced); releases go on the box
# with scripts/install-staging.sh, builds between releases with
# scripts/deploy-staging-build.sh.

Parameters:
    Hostname:
        Type: String
        Default: staging.supervictor.advin.io
        Description: FQDN for the staging endpoint

    InstanceType:
        Type: String
        Default: t4g.micro
        AllowedValues:
            - t4g.micro
            - t4g.small
            - t4g.medium

    HostedZoneId:
        Type: AWS::Route53::HostedZone::Id
        Description: Route53 hosted zone for advin.io

    Repo:
        Type: String
        Default: JimothyJohn/supervictor
        Description: GitHub repository whose release the bootstrap installs

    ReleaseTag:
        Type: String
        Default: v0.1.0
        Description: Release tag the bootstrap installs (scripts/install-endpoint.sh <tag>)

    BundleBucket:
        Type: String
        Default: supervictor
        Description: S3 bucket holding the mTLS PEMs the bootstrap fetches

    CaCertKey:
        Type: String
        Default: staging/ca.pem

    ServerCertKey:
        Type: String
        Default: staging/server.pem

    ServerKeyKey:
        Type: String
        Default: staging/server.key

    ExistingAllocationId:
        Type: String
        Default: ""
        Description: >-
            Allocation ID of an Elastic IP allocated outside this stack (the live
            box's eipalloc-…); empty allocates one here. Pair with ExistingPublicIp.

    ExistingPublicIp:
        Type: String
        Default: ""
        Description: The address of ExistingAllocationId (for the Route53 record); empty when the stack allocates its own.

    VpcId:
        Type: AWS::EC2::VPC::Id
        Description: Default VPC

    SubnetId:
        Type: AWS::EC2::Subnet::Id
        Description: Public subnet in the default VPC

    AmiId:
        Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
        Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
        Description: >-
            Resolved at deploy time. staging-stack-update.sh passes the pinned
            /supervictor/staging/ami-id so an update never replaces the instance.

Conditions:
    CreateEip: !Equals [!Ref ExistingAllocationId, ""]

Resources:
    SecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: supervictor staging - 443 mTLS ingress
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  CidrIp: 0.0.0.0/0
                  Description: mTLS API (devices, admins)
            Tags:
                - Key: Name
                  Value: supervictor-staging

    InstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            Policies:
                # The three PEMs the bootstrap installs, nothing else in the bucket.
                - PolicyName: CertRead
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Sid: StagingPemsOnly
                            Effect: Allow
                            Action:
                                - s3:GetObject
                            Resource:
                                - !Sub arn:aws:s3:::${BundleBucket}/${CaCertKey}
                                - !Sub arn:aws:s3:::${BundleBucket}/${ServerCertKey}
                                - !Sub arn:aws:s3:::${BundleBucket}/${ServerKeyKey}
                # Let's Encrypt DNS-01 from the box (certbot-dns-route53): the
                # plugin lists zones, writes the _acme-challenge TXT, polls the
                # change. Scoped to this zone, that one record name, TXT only.
                - PolicyName: AcmeDns01Route53
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Sid: AcmeListZones
                            Effect: Allow
                            Action: route53:ListHostedZones
                            # List actions take no resource ARN.
                            Resource: "*"
                          - Sid: AcmeChallengeTxtOnly
                            Effect: Allow
                            Action: route53:ChangeResourceRecordSets
                            Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
                            Condition:
                                ForAllValues:StringEquals:
                                    route53:ChangeResourceRecordSetsRecordTypes:
                                        - TXT
                                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                                        - !Sub _acme-challenge.${Hostname}
                          - Sid: AcmePollChange
                            Effect: Allow
                            Action: route53:GetChange
                            Resource: arn:aws:route53:::change/*

    InstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref InstanceRole

    ElasticIp:
        Type: AWS::EC2::EIP
        Condition: CreateEip
        Properties:
            Domain: vpc
            Tags:
                - Key: Name
                  Value: supervictor-staging

    Instance:
        Type: AWS::EC2::Instance
        Properties:
            ImageId: !Ref AmiId
            InstanceType: !Ref InstanceType
            IamInstanceProfile: !Ref InstanceProfile
            SubnetId: !Ref SubnetId
            SecurityGroupIds:
                - !Ref SecurityGroup
            BlockDeviceMappings:
                - DeviceName: /dev/xvda
                  Ebs:
                      VolumeSize: 20
                      VolumeType: gp3
                      Encrypted: true
                      DeleteOnTermination: true
            MetadataOptions:
                HttpTokens: required
                HttpEndpoint: enabled
            Tags:
                - Key: Name
                  Value: supervictor-staging
            # First boot only. Everything here is what scripts/install-staging.sh
            # does over SSM for a later release; bash variables are written
            # $NAME (no braces) so !Sub leaves them alone.
            UserData:
                Fn::Base64: !Sub |
                    #!/usr/bin/env bash
                    set -euo pipefail
                    exec > >(tee /var/log/bootstrap.log) 2>&1

                    echo "[bootstrap] packages"
                    dnf install -y curl tar gzip

                    echo "[bootstrap] mTLS material from s3://${BundleBucket}"
                    install -d -m 0700 /etc/supervictor
                    aws s3 cp s3://${BundleBucket}/${CaCertKey}     /etc/supervictor/ca.pem
                    aws s3 cp s3://${BundleBucket}/${ServerCertKey} /etc/supervictor/server.pem
                    aws s3 cp s3://${BundleBucket}/${ServerKeyKey}  /etc/supervictor/server.key
                    chmod 0644 /etc/supervictor/ca.pem /etc/supervictor/server.pem
                    chmod 0600 /etc/supervictor/server.key

                    echo "[bootstrap] installer + unit from ${Repo}@${ReleaseTag}"
                    RAW=https://raw.githubusercontent.com/${Repo}/${ReleaseTag}
                    install -d /opt/supervictor/install/scripts /opt/supervictor/install/supervictor/endpoint/deploy
                    curl -fsSL -o /opt/supervictor/install/scripts/install-endpoint.sh "$RAW/scripts/install-endpoint.sh"
                    curl -fsSL -o /opt/supervictor/install/supervictor/endpoint/deploy/supervictor-endpoint.service "$RAW/supervictor/endpoint/deploy/supervictor-endpoint.service"
                    chmod +x /opt/supervictor/install/scripts/install-endpoint.sh

                    echo "[bootstrap] installing supervictor-endpoint ${ReleaseTag}"
                    /opt/supervictor/install/scripts/install-endpoint.sh "${ReleaseTag}"

                    echo "[bootstrap] done"
                    systemctl --no-pager --lines=3 status supervictor-endpoint || true

    ElasticIpAssociation:
        Type: AWS::EC2::EIPAssociation
        Properties:
            AllocationId: !If [CreateEip, !GetAtt ElasticIp.AllocationId, !Ref ExistingAllocationId]
            InstanceId: !Ref Instance

    DnsRecord:
        Type: AWS::Route53::RecordSet
        Properties:
            HostedZoneId: !Ref HostedZoneId
            Name: !Ref Hostname
            Type: A
            TTL: 60
            ResourceRecords:
                - !If [CreateEip, !Ref ElasticIp, !Ref ExistingPublicIp]

Outputs:
    PublicIp:
        Value: !If [CreateEip, !Ref ElasticIp, !Ref ExistingPublicIp]
    Hostname:
        Value: !Ref Hostname
    InstanceId:
        Value: !Ref Instance
    ShellCommand:
        Value: !Sub aws ssm start-session --target ${Instance} --region ${AWS::Region}
    HealthCheck:
        Value: !Sub https://${Hostname}/health (needs a client certificate)

[package]
name = "supervictor-endpoint"
version = "0.1.0"
edition = "2021"

[features]
default = ["sqlite", "ui", "tls"]
sqlite = ["rusqlite"]
dynamo = ["aws-sdk-dynamodb", "aws-config"]
# In-binary mTLS termination (TLS_CERT / TLS_KEY / TLS_CLIENT_CA): the
# single-binary deployment path. Off for the Lambda image is harmless but
# unnecessary — API Gateway terminates there.
tls = ["rustls", "tokio-rustls", "rustls-pki-types", "x509-parser"]
# Server-rendered fleet dashboard (docs plan: maud templates + SSE).
# Disable for API-only deployments: --no-default-features --features sqlite
ui = ["maud"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# maud: compile-time-checked, auto-escaping HTML. Proc-macro stack (syn/quote)
# is already in tree via serde derive. futures-core: trait-only crate (Stream
# for the SSE adapter and the stalled firmware body), already in tree via
# hyper/tokio ecosystem.
maud = { version = "0.27", features = ["axum"], optional = true }
futures-core = "0.3"
aws-sdk-dynamodb = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
supervictor-common = { path = "../common", features = ["alloc"] }
# TLS stack (feature `tls`). All four crates were already in the workspace
# lock (edge desktop build, AWS SDK); this adds edges, not crates. ring
# rather than aws-lc-rs: no cmake/C toolchain for the musl release build,
# matching the edge desktop decision.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
x509-parser = { version = "0.18", optional = true }
# OTA image digests (firmware.rs). Already in the workspace lock through
# ring/rustls-adjacent crates and the edge build; adds an edge, not a crate.
sha2 = "0.10"

# Renders a seeded, static copy of the dashboard for the GitHub Pages demo.
[[example]]
name = "render_demo"
required-features = ["ui"]

[dev-dependencies]
axum-test = "21"
# Property tests for payload validation (tests/test_payload_props.rs).
# Minimal feature set: no fork/timeout runners (rusty-fork, tempfile,
# wait-timeout stay out of the tree); `std` brings the regex string
# strategies. Dep review in the PR that added it (2026-10-23).
proptest = { version = "1.12", default-features = false, features = ["std"] }
# Scratch directories for the firmware blob-store tests; already in the
# workspace lock (dev-only), so no new crate.
tempfile = "3"

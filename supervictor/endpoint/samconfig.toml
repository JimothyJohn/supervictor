# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default]
[default.global.parameters]
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Stack names and parameter overrides mirror the live stacks (verified against
# `aws cloudformation describe-stacks` on 2026-10-24); the Quickstart reads
# stack_name from here to find the deployed endpoint.
[dev]
[dev.deploy.parameters]
stack_name = "supervictor-dev"
parameter_overrides = "Environment=dev StackName=supervictor-dev AppName=supervictor TruststoreUri=s3://supervictor/truststore-dev.pem DomainName=dev.supervictor.advin.io"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
resolve_image_repos = true

[prod]
[prod.deploy.parameters]
stack_name = "supervictor-prod"
parameter_overrides = "Environment=prod StackName=supervictor-prod AppName=supervictor TruststoreUri=s3://supervictor/truststore.pem DomainName=supervictor.advin.io"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
resolve_image_repos = true

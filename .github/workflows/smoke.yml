name: Post-deploy smoke

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Base URL of the deployed endpoint (e.g. https://staging.supervictor.advin.io)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Health smoke against deployed endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - name: Quickstart integration (staging smoke)
        run: STAGING_URL="${{ inputs.staging_url }}" ./Quickstart integration

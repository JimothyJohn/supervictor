name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Endpoint server for the t4g.micro staging host (and any arm64 Linux box).
  build-endpoint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Build endpoint
        run: cargo build -p supervictor-endpoint --release --features sqlite,dynamo

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/supervictor-endpoint dist/supervictor-endpoint
          cd dist
          tar czf supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz supervictor-endpoint
          shasum -a 256 supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz \
            > supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supervictor-endpoint-aarch64-unknown-linux-gnu
          path: dist/supervictor-endpoint-*.tar.gz*

  release:
    needs: [build-endpoint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            supervictor-endpoint-*.tar.gz
            supervictor-endpoint-*.sha256
          generate_release_notes: true

name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Endpoint server for the t4g.micro staging host (and any arm64 Linux box).
  build-endpoint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Build endpoint
        run: cargo build -p supervictor-endpoint --release --features sqlite,dynamo

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/supervictor-endpoint dist/supervictor-endpoint
          cd dist
          tar czf supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz supervictor-endpoint
          shasum -a 256 supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz \
            > supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervictor-endpoint-aarch64-unknown-linux-gnu
          path: dist/supervictor-endpoint-*.tar.gz*

  release:
    needs: [build-endpoint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            supervictor-endpoint-*.tar.gz
            supervictor-endpoint-*.sha256
          generate_release_notes: true

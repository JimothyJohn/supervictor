name: Deploy Rust Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Build docs (common)
        run: cargo doc -p supervictor-common --features alloc --no-deps

      - name: Build docs (endpoint)
        run: cargo doc -p supervictor-endpoint --features sqlite --no-deps --target x86_64-unknown-linux-gnu

      - name: Render dashboard demo (static, seeded)
        run: |
          mkdir -p site
          cargo run -p supervictor-endpoint --example render_demo -- site/demo

      - name: Assemble site (landing page + demo + rustdoc under /api)
        run: |
          cp -r docs/* site/
          mkdir -p site/api
          cp -r target/doc/* site/api/ 2>/dev/null || true
          cp -r target/x86_64-unknown-linux-gnu/doc/* site/api/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0;url=supervictor_endpoint/index.html">' \
            > site/api/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

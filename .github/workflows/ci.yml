name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Lint + test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check edge desktop feature
        run: cargo check -p supervictor-edge --features desktop
      - name: Check endpoint API-only build (no ui)
        run: cargo check -p supervictor-endpoint --no-default-features --features sqlite

  dynamo:
    name: DynamoDB store (DynamoDB Local)
    runs-on: ubuntu-latest
    # The production backend, tested against a real DynamoDB rather than
    # compiled and hoped for. tests/test_store_dynamo.rs refuses to run
    # without the endpoint, so a missing container fails loudly.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy (dynamo feature, deny warnings)
        run: cargo clippy -p supervictor-endpoint --all-targets --features dynamo -- -D warnings
      - name: Test endpoint against DynamoDB Local
        run: cargo test -p supervictor-endpoint --features dynamo --locked

  embedded:
    name: Embedded build (riscv32, ESP32-C3)
    runs-on: ubuntu-latest
    env:
      # Compile-time config baked into the firmware. certs/ is gitignored,
      # so CI generates throwaway certs below — compile check only.
      CERT_PATH: ci-certs/
      CA_PATH: ca/ca.pem
      DEVICE_NAME: ci-device
      HOST: ci.invalid
      SSID: ci-ssid
      PASSWORD: ci-password
      TLS_VERSION: "1.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: Generate throwaway CI certs
        run: |
          mkdir -p ci-certs/ca ci-certs/devices/ci-device
          openssl ecparam -genkey -name prime256v1 -out ci-certs/ca/ca.key
          openssl req -x509 -new -key ci-certs/ca/ca.key -subj "/CN=ci-ca" -days 1 -out ci-certs/ca/ca.pem
          openssl ecparam -genkey -name prime256v1 -out ci-certs/devices/ci-device/client.key
          openssl req -new -key ci-certs/devices/ci-device/client.key -subj "/CN=ci-device" \
            | openssl x509 -req -CA ci-certs/ca/ca.pem -CAkey ci-certs/ca/ca.key -CAcreateserial -days 1 \
              -out ci-certs/devices/ci-device/client.pem
      - name: Check embedded firmware
        working-directory: supervictor/edge
        run: cargo check --features embedded --locked

name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Lint + test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check edge desktop feature
        run: cargo check -p supervictor-edge --features desktop
      - name: Check endpoint API-only build (no ui)
        run: cargo check -p supervictor-endpoint --no-default-features --features sqlite

  embedded:
    name: Embedded build (ESP32 xtensa + ESP32-C3 riscv)
    runs-on: ubuntu-latest
    env:
      # Compile-time config baked into the firmware. certs/ is gitignored,
      # so CI generates throwaway certs below — compile check only.
      CERT_PATH: ci-certs/
      CA_PATH: ca/ca.pem
      DEVICE_NAME: ci-device
      HOST: ci.invalid
      SSID: ci-ssid
      PASSWORD: ci-password
      TLS_VERSION: "1.3"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Xtensa (original ESP32) needs the esp-rs fork toolchain; this action
      # runs espup and exports the toolchain env into the job.
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32
          default: false
      - name: Generate throwaway CI certs
        run: |
          mkdir -p ci-certs/ca ci-certs/devices/ci-device
          openssl ecparam -genkey -name prime256v1 -out ci-certs/ca/ca.key
          openssl req -x509 -new -key ci-certs/ca/ca.key -subj "/CN=ci-ca" -days 1 -out ci-certs/ca/ca.pem
          openssl ecparam -genkey -name prime256v1 -out ci-certs/devices/ci-device/client.key
          openssl req -new -key ci-certs/devices/ci-device/client.key -subj "/CN=ci-device" \
            | openssl x509 -req -CA ci-certs/ca/ca.pem -CAkey ci-certs/ca/ca.key -CAcreateserial -days 1 \
              -out ci-certs/devices/ci-device/client.pem
      - name: Check embedded firmware (ethernet — primary uplink, ESP32)
        working-directory: supervictor/edge
        run: cargo check --features ethernet --locked
      - name: Check embedded firmware (wifi — fallback interface, ESP32)
        working-directory: supervictor/edge
        run: cargo check --features wifi,chip-esp32 --locked
      # The esp toolchain's rustc carries the riscv backend too; same
      # toolchain builds the C3 with build-std, no extra install.
      - name: Check embedded firmware (wifi, ESP32-C3 riscv)
        working-directory: supervictor/edge
        run: cargo check --features wifi,chip-esp32c3 --target riscv32imc-unknown-none-elf --locked

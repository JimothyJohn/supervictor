version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # PRs land in dev via auto-merge on green CI; master promotion is manual.
    target-branch: "dev"
    open-pull-requests-limit: 5
    # Group minor/patch bumps into one weekly PR; majors get their own PR.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The esp-rs crates move as a set (supervictor/edge/Cargo.toml). The
      # edge build sits on the esp-hal 1.1 line because the newest stable
      # esp-radio (0.18) requires ~1.1; esp-hal 1.2 and the matching esp-rtos
      # 0.4 / esp-alloc 0.11 / esp-storage 0.10 / esp-bootloader-esp-idf 0.6 /
      # esp-backtrace 0.20 / esp-println 0.18 / mbedtls-rs 0.3 do not resolve
      # against it, and a lone bump would break the weekly group. They all
      # move together once esp-radio 1.0 ships stable (ROADMAP.md, firmware
      # track). Patch releases still flow.
      - dependency-name: "esp-hal"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "esp-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "embassy-executor"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mbedtls-rs"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -8 62 62" width="620" height="620" font-family="IBM Plex Mono, monospace" font-size="1.6">
  <title>SV-HAT-A board outline, 28 x 40 mm with a 13 x 13 mm UEXT notch, top view, 1 unit = 1 mm</title>
  <g transform="translate(0,40) scale(1,-1)">
    <!-- board with the notch (x 7.5-20.5, y 27-40 removed) -->
    <path d="M1 0 H27 Q28 0 28 1 V39 Q28 40 27 40 H22 V27 H6 V40 H1 Q0 40 0 39 V1 Q0 0 1 0 Z" fill="#0f3d2e" stroke="#e4e4e7" stroke-width="0.25"/>
    <!-- UEXT box of the host board, shown ghosted where it sits under the notch -->
    <rect x="6.25" y="28.5" width="15.5" height="9" fill="none" stroke="#8b8b93" stroke-width="0.15" stroke-dasharray="0.6 0.4"/>
    <!-- SHT41 slots -->
    <g stroke="#f97316" stroke-width="1" stroke-linecap="round">
      <line x1="22.2" y1="30" x2="26" y2="30"/>
      <line x1="26.1" y1="30" x2="26.1" y2="36"/>
    </g>
    <!-- header pins, pin 1 at +Y -->
    <g fill="#fbbf24" stroke="#000" stroke-width="0.1">
      <g id="j1">
        <circle cx="1.3" cy="31.43" r="0.75"/><circle cx="1.3" cy="28.89" r="0.75"/><circle cx="1.3" cy="26.35" r="0.75"/><circle cx="1.3" cy="23.81" r="0.75"/><circle cx="1.3" cy="21.27" r="0.75"/>
        <circle cx="1.3" cy="18.73" r="0.75"/><circle cx="1.3" cy="16.19" r="0.75"/><circle cx="1.3" cy="13.65" r="0.75"/><circle cx="1.3" cy="11.11" r="0.75"/><circle cx="1.3" cy="8.57" r="0.75"/>
      </g>
      <use href="#j1" x="25.4"/>
    </g>
    <rect x="0.03" y="7.2" width="2.54" height="25.5" fill="none" stroke="#fbbf24" stroke-width="0.15"/>
    <rect x="25.43" y="7.2" width="2.54" height="25.5" fill="none" stroke="#fbbf24" stroke-width="0.15"/>
    <rect x="0.55" y="30.68" width="1.5" height="1.5" fill="none" stroke="#e4e4e7" stroke-width="0.2"/>
    <rect x="25.95" y="30.68" width="1.5" height="1.5" fill="none" stroke="#e4e4e7" stroke-width="0.2"/>
    <!-- J3 jack at the -Y edge -->
    <rect x="10.5" y="0.5" width="7" height="7" fill="#27272a" stroke="#e4e4e7" stroke-width="0.2"/>
    <rect x="12.75" y="-2.5" width="2.5" height="3" fill="#27272a" stroke="#e4e4e7" stroke-width="0.2"/>
    <!-- J4 STEMMA QT at the +Y edge -->
    <rect x="22" y="37.3" width="6" height="2.6" fill="#27272a" stroke="#e4e4e7" stroke-width="0.2"/>
    <!-- part bodies from placement.csv -->
    <g fill="#3f3f46" stroke="#e4e4e7" stroke-width="0.12">
      <rect x="3.6" y="30.05" width="1.6" height="2.9"/> <!-- U1 rot 90 -->
      <rect x="12.55" y="20.6" width="2.9" height="2.8"/> <!-- IC1 -->
      <rect x="22.75" y="32.25" width="1.5" height="1.5"/> <!-- U2 -->
      <rect x="9.9" y="11.3" width="2.2" height="1.4"/> <!-- D2 -->
      <rect x="16.4" y="18.3" width="2.2" height="1.4"/> <!-- D1 -->
      <rect x="19.9" y="15" width="1.2" height="2"/> <!-- C7 -->
      <rect x="3.4" y="26.9" width="1.6" height="0.8"/><rect x="3.4" y="28.7" width="1.6" height="0.8"/>
      <rect x="3.4" y="33.5" width="1.6" height="0.8"/><rect x="3.4" y="35.3" width="1.6" height="0.8"/>
      <rect x="13.2" y="24.8" width="1.6" height="0.8"/>
      <rect x="10.2" y="18.6" width="1.6" height="0.8"/><rect x="10.2" y="16.1" width="1.6" height="0.8"/><rect x="13.2" y="11.6" width="1.6" height="0.8"/>
      <rect x="20.1" y="11.7" width="0.8" height="1.6"/>
      <rect x="22.7" y="18.6" width="1.6" height="0.8"/><rect x="22.7" y="21.1" width="1.6" height="0.8"/>
      <rect x="22.7" y="35.4" width="1.6" height="0.8"/>
    </g>
    <g fill="#22c55e"><circle cx="22.5" cy="24.5" r="0.75"/><circle cx="22.5" cy="27" r="0.75"/><circle cx="14" cy="9" r="0.75"/></g>
  </g>
  <g fill="#e4e4e7">
    <text x="-6" y="9.1">J1</text><text x="29.2" y="9.1">J2</text>
    <text x="-6" y="7.2" font-size="1.2">pin1</text><text x="29.2" y="7.2" font-size="1.2">pin1</text>
    <text x="-6.4" y="11" font-size="1.1">U1 LDO →</text>
    <text x="11.2" y="17.2" font-size="1.2">IC1 op-amp</text>
    <text x="20.4" y="11.4" font-size="1.1">U2 SHT41</text>
    <text x="9.6" y="7" font-size="1.2" fill="#8b8b93">UEXT notch</text>
    <text x="9.6" y="8.8" font-size="1.0" fill="#8b8b93">(host UEXT box ghosted)</text>
    <text x="9" y="50.4" font-size="1.2">J3 3.5 mm jack (opening faces -Y)</text>
    <text x="21.2" y="-0.4" font-size="1.0">J4 STEMMA QT</text>
    <text x="9.2" y="30.2" font-size="1.2">D2</text><text x="15.6" y="22.2" font-size="1.2">D1</text>
    <text x="19.4" y="26.4" font-size="1.2">C7</text>
    <text x="19.4" y="19.6" font-size="1.1">R5 C8</text>
    <text x="23.6" y="16" font-size="1.0" fill="#22c55e">TP1</text><text x="23.6" y="13.5" font-size="1.0" fill="#22c55e">TP2</text><text x="15" y="31.4" font-size="1.0" fill="#22c55e">TP3</text>
    <text x="0" y="-2.2" font-size="1.7">SV-HAT-A  28 x 40 mm  top view  (+Y = ESP32 end)</text>
    <text x="0" y="-5" font-size="1.15" fill="#8b8b93">1x10 2.54 mm headers 25.40 apart, pin 1 at Y=31.43 · orange = 1 mm slots</text>
    <line x1="0" y1="42" x2="28" y2="42" stroke="#8b8b93" stroke-width="0.15"/><text x="12.5" y="43.6" font-size="1.2" fill="#8b8b93">28.00</text>
    <line x1="-2" y1="0" x2="-2" y2="40" stroke="#8b8b93" stroke-width="0.15"/><text x="-4.2" y="21" font-size="1.2" fill="#8b8b93" transform="rotate(-90 -4.2 21)">40.00</text>
    <line x1="1.3" y1="45.5" x2="26.7" y2="45.5" stroke="#8b8b93" stroke-width="0.15"/><text x="11.5" y="47.1" font-size="1.2" fill="#8b8b93">25.40 (header centres)</text>
  </g>
</svg>
